name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    # oldest available runner, so the AppImage runs on older glibc
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libharfbuzz-dev libxrandr-dev libxi-dev libglu1-mesa-dev libfuse2 libxcb-cursor0 libspeechd2
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          modules: 'all'
          cache: true
      - name: Build
        run: MAKE_PARALLEL=$(nproc) ./linuxdeploy_build_and_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: shioyek-linux-x86_64
          path: shioyek-linux-x86_64.AppImage

  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install freeglut mesa harfbuzz
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          modules: 'all'
          cache: true
      - name: Build
        run: MAKE_PARALLEL=$(sysctl -n hw.logicalcpu) SHIOYEK_ARCH=${{ matrix.arch }} ./build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: shioyek-mac-${{ matrix.arch }}
          path: build/shioyek-mac-${{ matrix.arch }}.dmg

  release:
    if: github.event_name == 'push'
    needs: [build-linux, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.AppImage
            *.dmg
      - name: Rolling "latest" prerelease from main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest --prerelease --target "$GITHUB_SHA" \
            --title "Latest build from main" --notes "Built from $GITHUB_SHA" \
            *.AppImage *.dmg
